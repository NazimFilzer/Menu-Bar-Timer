<!--
  PROTOTYPE — throwaway. Not the app.

  Question: where should these three insights live, and how much should each say?
    1. Same part of each week   (Week page)
    2. Goal consistency         (Analytics)
    3. Sprint patterns          (Analytics)

  Three original options and the selected mix, switchable via ?variant=A|B|C|D.
  D combines Week B, goal consistency C, and sprint patterns A.
  Mock data only. No persistence. Keep as a prototype reference.

  Run:  open "Prototype/insights-prototype.html"
-->
<!doctype html>
<html lang="en">
<head>

<body>

<div class="proto-strip">
  <b>Prototype</b>
  <span>throwaway · mock data · question: where do these three insights live, and how much should each say?</span>
</div>

<div class="app">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main">
    <div class="topbar" id="topbar"></div>
    <div class="canvas" id="canvas"></div>
  </main>
</div>

<div class="switcher">
  <button id="prev" title="Previous variant (←)">‹</button>
  <div class="label" id="label"></div>
  <button id="next" title="Next variant (→)">›</button>
</div>

<script>
/* ============================================================
   Scenario
   ============================================================ */
const CFG = {
  today: new Date(2026, 10, 5),   // Thu 5 Nov 2026
  nowMin: 16 * 60 + 15,           // 16:15, late afternoon
  dailyGoalMin: 8 * 60,
  weeklyGoalMin: 40 * 60,
  workingWeekdays: [1, 2, 3, 4, 5],
  daysOff: new Set(['2026-09-18', '2026-10-12']),
};
const NOW_LABEL = '16:15';
const DOW = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
const TODAY_NAME = DOW[(CFG.today.getDay() + 6) % 7];
const TAGS = ['Development', 'Development', 'Development', 'Design', 'Meetings', 'Admin'];

/* ============================================================
   Dates
   ============================================================ */
const DAY = 86400000;
const keyOf = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const addDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
const mondayOf = d => addDays(d, -((d.getDay() + 6) % 7));
const sameDay = (a, b) => keyOf(a) === keyOf(b);
const shortDate = d => d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
const longDate = d => d.toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' });

/* ============================================================
   Mock sprints — shaped like the real Sprint model:
   net work (minutes), paused minutes, pause count, tag.
   ============================================================ */
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const rand = mulberry32(20261105);

const TODAY_SPRINTS = [
  { start: 9 * 60 + 5,   net: 50, paused: 0,  pauseCount: 0, tag: 'Development' },
  { start: 10 * 60 + 10, net: 48, paused: 7,  pauseCount: 1, tag: 'Development' },
  { start: 11 * 60 + 20, net: 42, paused: 0,  pauseCount: 0, tag: 'Design' },
  { start: 12 * 60 + 15, net: 55, paused: 12, pauseCount: 2, tag: 'Meetings' },
  { start: 13 * 60 + 45, net: 35, paused: 5,  pauseCount: 1, tag: 'Development' },
  { start: 14 * 60 + 40, net: 52, paused: 9,  pauseCount: 1, tag: 'Development' },
  { start: 15 * 60 + 30, net: 38, paused: 0,  pauseCount: 0, tag: 'Admin' },
];

// Two hand-set weeks so the demo tells one clear story:
// this week is slightly ahead at the same point, but behind on whole days.
const STORY = {
  '2026-11-02': 8 * 60 + 25,
  '2026-11-03': 7 * 60 + 5,
  '2026-11-04': 8 * 60 + 40,
  '2026-10-26': 8 * 60 + 5,
  '2026-10-27': 7 * 60 + 25,
  '2026-10-28': 8 * 60 + 15,
  '2026-10-29': 8 * 60 + 10,
};

const DATA = {};
const RANGE_START = addDays(mondayOf(CFG.today), -12 * 7);

(function generate() {
  let weekIndex = 0;
  for (let d = RANGE_START; d <= CFG.today; d = addDays(d, 1)) {
    weekIndex = Math.floor((d - RANGE_START) / (7 * DAY));
    DATA[keyOf(d)] = daySprints(d, weekIndex);
  }
})();

function daySprints(d, weekIndex) {
  if (sameDay(d, CFG.today)) return TODAY_SPRINTS.slice();
  const key = keyOf(d);
  const dow = d.getDay();
  const scheduled = CFG.workingWeekdays.includes(dow) && !CFG.daysOff.has(key);

  if (!scheduled) {
    if (rand() < 0.16) {
      return [{ start: 10 * 60 + Math.round(rand() * 180), net: 35 + Math.round(rand() * 50), paused: 0, pauseCount: 0, tag: 'Admin' }];
    }
    return [];
  }

  // A believable mix: about half the scheduled days clear the 8h goal.
  const roll = rand();
  let target;
  if (roll < 0.55) target = (8.0 + rand() * 1.2) * 60;        // goal met
  else if (roll < 0.88) target = (6.0 + rand() * 1.9) * 60;   // short of goal
  else if (roll < 0.96) target = (3.0 + rand() * 2.5) * 60;   // half day
  else target = (0.5 + rand() * 1.5) * 60;                    // barely started

  if (STORY[key] != null) {
    target = STORY[key];
  } else {
    // recent weeks run slightly lighter — gives the comparison something to say
    target *= 1 - weekIndex * 0.008;
  }

  const sprints = [];
  let clock = 8 * 60 + 40 + Math.round(rand() * 30);
  let remaining = target;
  let guard = 0;

  while (remaining > 9 && guard++ < 20 && clock < 21 * 60) {
    const r = rand();
    let net;
    if (r < 0.12) net = 6 + rand() * 9;          // quick check
    else if (r < 0.55) net = 25 + rand() * 35;
    else if (r < 0.90) net = 45 + rand() * 25;
    else net = 70 + rand() * 35;

    net = Math.round(Math.min(net, remaining));
    if (net < 6) break;

    const pauseCount = rand() < 0.40 ? 0 : 1 + Math.floor(rand() * 3);
    const paused = pauseCount ? Math.round(Math.min(net * 0.3, 3 + rand() * 14)) : 0;
    sprints.push({ start: clock, net, paused, pauseCount, tag: TAGS[Math.floor(rand() * TAGS.length)] });
    clock += net + paused + 5 + Math.round(rand() * 16);
    remaining -= net;
  }
  return sprints;
}

/* ============================================================
   Compute
   ============================================================ */
const sprintsOn = d => DATA[keyOf(d)] || [];
const netOf = d => sprintsOn(d).reduce((a, s) => a + s.net, 0);
const isScheduled = d => CFG.workingWeekdays.includes(d.getDay()) && !CFG.daysOff.has(keyOf(d));

// Net work recorded before a clock time. Prorates a sprint that straddles the cut.
function netBefore(d, capMin) {
  if (capMin == null) return netOf(d);
  let total = 0;
  for (const s of sprintsOn(d)) {
    const gross = s.net + s.paused;
    const end = s.start + gross;
    if (s.start >= capMin) continue;
    if (end <= capMin) { total += s.net; continue; }
    total += s.net * ((capMin - s.start) / gross);
  }
  return total;
}

// ---- 1. same part of each week ----
function buildComparison(mode) {
  const ws = mondayOf(CFG.today);
  const idx = (CFG.today.getDay() + 6) % 7;   // Thu -> 3
  const rows = [];

  for (let i = 0; i < 7; i++) {
    const cur = addDays(ws, i);
    const prev = addDays(ws, i - 7);
    const future = cur > CFG.today;
    const isToday = i === idx;

    // "Cut" mode: last week's matching weekday stops at the same clock time.
    const prevCap = (mode === 'cut' && i === idx) ? CFG.nowMin : null;
    const curCap = (mode === 'cut' && i === idx) ? CFG.nowMin : null;

    rows.push({
      label: DOW[i],
      date: cur,
      cur: future ? 0 : netBefore(cur, curCap),
      prev: netBefore(prev, prevCap),
      isToday,
      future,
      scheduled: isScheduled(cur),
    });
  }

  const span = rows.slice(0, idx + 1);
  const curTotal = span.reduce((a, r) => a + r.cur, 0);
  const prevTotal = span.reduce((a, r) => a + r.prev, 0);
  const max = Math.max(...rows.map(r => Math.max(r.cur, r.prev)), 60);

  return { rows, idx, curTotal, prevTotal, delta: curTotal - prevTotal, max, mode };
}

// ---- 2. goal consistency ----
function buildConsistency() {
  const ws = mondayOf(CFG.today);
  const weeks = [];
  const all = [];

  for (let w = 12; w >= 0; w--) {
    const start = addDays(ws, -w * 7);
    let met = 0, sched = 0, lowMisses = 0;
    for (let i = 0; i < 7; i++) {
      const d = addDays(start, i);
      if (d >= CFG.today) continue;          // today is still in progress
      if (!isScheduled(d)) continue;
      sched++;
      const net = netOf(d);
      const hit = net >= CFG.dailyGoalMin;
      if (hit) met++; else if (net < 120) lowMisses++;
      all.push({ date: d, net, hit });
    }
    if (sched > 0) weeks.push({ start, met, sched, pct: met / sched, lowMisses });
  }

  const met = weeks.reduce((a, w) => a + w.met, 0);
  const sched = weeks.reduce((a, w) => a + w.sched, 0);
  const lowMisses = weeks.reduce((a, w) => a + w.lowMisses, 0);

  // current streak: walk back from yesterday over scheduled days
  let streak = 0;
  for (let d = addDays(CFG.today, -1); d >= RANGE_START; d = addDays(d, -1)) {
    if (!isScheduled(d)) continue;
    if (netOf(d) >= CFG.dailyGoalMin) streak++; else break;
  }

  // best streak
  let best = 0, run = 0;
  for (const day of all) {
    if (day.hit) { run++; best = Math.max(best, run); } else run = 0;
  }

  return { weeks, met, sched, pct: sched ? met / sched : 0, lowMisses, streak, best, all };
}

// ---- 3. sprint patterns ----
function buildSprints() {
  const all = [];
  for (const list of Object.values(DATA)) for (const s of list) all.push(s);
  const nets = all.map(s => s.net).sort((a, b) => a - b);
  const sum = nets.reduce((a, b) => a + b, 0);
  const median = nets.length ? (nets.length % 2 ? nets[(nets.length - 1) / 2] : (nets[nets.length / 2 - 1] + nets[nets.length / 2]) / 2) : 0;
  const mean = nets.length ? sum / nets.length : 0;

  const bucketDefs = [
    { label: '<15m',   test: n => n < 15 },
    { label: '15–30m', test: n => n >= 15 && n < 30 },
    { label: '30–45m', test: n => n >= 30 && n < 45 },
    { label: '45–60m', test: n => n >= 45 && n < 60 },
    { label: '1–1.5h', test: n => n >= 60 && n < 90 },
    { label: '1.5h+',  test: n => n >= 90 },
  ];
  const buckets = bucketDefs.map(b => {
    const items = all.filter(s => b.test(s.net));
    return { label: b.label, count: items.length, share: all.length ? items.length / all.length : 0, total: items.reduce((a, s) => a + s.net, 0) };
  });

  const withPause = all.filter(s => s.pauseCount > 0);
  const pausedTotal = all.reduce((a, s) => a + s.paused, 0);
  const longest = all.reduce((a, s) => Math.max(a, s.net), 0);

  return {
    count: all.length, median, mean, buckets,
    pauseShare: all.length ? withPause.length / all.length : 0,
    avgPaused: all.length ? pausedTotal / all.length : 0,
    avgPauseCount: all.length ? all.reduce((a, s) => a + s.pauseCount, 0) / all.length : 0,
    longest, totalNet: sum,
  };
}

/* ============================================================
   Format
   ============================================================ */
const hm = min => {
  const m = Math.round(min);
  if (m < 60) return `${m}m`;
  const h = Math.floor(m / 60), r = m % 60;
  return r ? `${h}h ${String(r).padStart(2, '0')}m` : `${h}h`;
};
const signed = min => (min < 0 ? '−' : '+') + hm(Math.abs(min));
const pct = (x, d = 0) => `${(x * 100).toFixed(d)}%`;
const hours1 = min => (min / 60).toFixed(1);
const missText = n => (n === 1
  ? 'One miss had under 2h recorded.'
  : `${n} misses had under 2h recorded.`);

  // --- week x day matrix, last 6 weeks ---
  const matrixRows = [];
  let anyOff = false;
  for (let w = 5; w >= 0; w--) {
    const start = addDays(ws, -w * 7);
    const isNow = w === 0;
    const cells = DOW.map((_, i) => {

      const d = addDays(start, i);

    const prevTotal = Array.from({ length: idx + 1 }, (_, i) => netOf(addDays(prevStart, i))).reduce((a, b) => a + b, 0);
    const delta = spanTotal - prevTotal;

    if (hasOff) anyOff = true;

    matrixRows.push(`<tr class="${isNow ? 'now' : ''}">
      <td>${shortDate(start)}${isNow ? ' · now' : ''}${hasOff ? ' †' : ''}</td>
      ${cells}
      <td class="n">${hm(spanTotal)}</td>
      <td class="n ${delta >= 0 ? 'pos' : 'neg'}">${signed(delta)}</td>
    </tr>`);
  }

  // --- goal grid: 13 weeks x 7 days ---
  const sprintRows = s.buckets.map(b => `
    <tr>
      <td>${b.label}</td>
      <td class="n">${b.count}</td>
      <td class="n">${pct(b.share)}</td>
      <td class="n">${hm(b.total)}</td>
      <td class="n dim">${b.count ? hm(b.total / b.count) : '—'}</td>
    </tr>`).join('');

  return `
  <div class="proto-note"><b>C — Dense matrix.</b> ${VARIANTS.C.note}</div>

  <div class="strip">
    <div class="strip-cell"><div class="k">Mon–Thu</div><div class="v">${hm(c.curTotal)}<small>vs ${hm(c.prevTotal)}</small></div></div>
    <div class="strip-cell"><div class="k">Change</div><div class="v" style="color:${ahead ? 'var(--good)' : 'var(--bad)'}">${signed(c.delta)}</div></div>
    <div class="strip-cell"><div class="k">Goal rate</div><div class="v">${pct(g.pct)}<small>${g.met}/${g.sched}</small></div></div>
    <div class="strip-cell"><div class="k">Median sprint</div><div class="v">${hm(s.median)}<small>mean ${hm(s.mean)}</small></div></div>
    <div class="strip-cell"><div class="k">Paused sprints</div><div class="v">${pct(s.pauseShare)}<small>${hm(s.avgPaused)} each</small></div></div>
    <div class="strip-cell"><div class="k">Longest</div><div class="v">${hm(s.longest)}<small>${s.count} sprints</small></div></div>
  </div>

  <div class="tbl-wrap">
    <div class="tbl-head">
      <h3>Hours by day, last 6 weeks</h3>
      <span class="hint">green = daily goal met · — day off · · future</span>
      <div class="spacer" style="margin-left:auto"></div>
      <div class="seg">
        <button class="${state.mode === 'days' ? 'on' : ''}" data-mode="days">Full days</button>
        <button class="${state.mode === 'cut' ? 'on' : ''}" data-mode="cut">Cut at ${NOW_LABEL}</button>
      </div>
    </div>
    <table>
      <thead><tr><th>Week</th>${DOW.map(d => `<th class="n">${d}</th>`).join('')}<th class="n">Mon–today</th><th class="n">Δ prior</th></tr></thead>
      <tbody>${matrixRows.join('')}</tbody>
    </table>
    ${anyOff ? '<p class="foot">† A day off falls inside one of the compared weeks, so that change is not like-for-like.</p>' : ''}
  </div>

  ${goalGridHTML(g)}

  <div class="tbl-wrap">
    <div class="tbl-head">
      <h3>Sprint length distribution</h3>
      <span class="hint">${s.count} completed sprints · ${pct(s.pauseShare)} include a pause · ${s.avgPauseCount.toFixed(1)} pauses each</span>
    </div>
    <table>
      <thead><tr><th>Length</th><th class="n">Sprints</th><th class="n">Share</th><th class="n">Total</th><th class="n">Average</th></tr></thead>
      <tbody>${sprintRows}</tbody>
    </table>
  </div>`;
}

/* ============================================================
   Variant D — the chosen mix
   ============================================================ */
function renderD() {
  return state.page === 'week' ? renderDWeek() : renderDAnalytics();
}

function renderDWeek() {
  const c = buildComparison(state.mode);
  const ahead = c.delta >= 0;
  const maxDay = Math.max(...c.rows.map(r => Math.max(r.cur, r.prev)), 60);

  const dayStrip = c.rows.filter(r => !r.future).map(r => `
    <div class="ds-row">
      <div class="d">${r.label}${r.isToday ? ' ·' : ''}</div>
      <div class="ds-bars">
        <div class="ds-bar cur" style="width:${Math.max(1, r.cur / maxDay * 100)}%"></div>
        <div class="ds-bar prev" style="width:${Math.max(1, r.prev / maxDay * 100)}%"></div>
      </div>
      <div class="v">${hm(r.cur)} / ${hm(r.prev)}</div>
    </div>`).join('');

  const cmpRows = c.rows.slice(0, c.idx + 1).map(r => `
    <tr><td>${r.label} ${shortDate(r.date)}</td><td class="n">${hm(r.cur)}</td><td class="n">${hm(r.prev)}</td>
    <td class="n ${r.cur - r.prev >= 0 ? 'pos' : 'neg'}">${signed(r.cur - r.prev)}</td></tr>`).join('');

  return `
  <div class="proto-note"><b>D — Final mix.</b> ${VARIANTS.D.note}</div>

  <div class="block">
    <div class="placement">Week page · <b>under the weekly goal bar</b></div>
    <div class="card narrative-card">
      <div class="eyebrow">Same point last week</div>
      <p class="lede">You’ve worked <b>${hm(c.curTotal)}</b> since Monday. At the same point last week you had <b>${hm(c.prevTotal)}</b> — you’re <b class="${ahead ? 'up' : 'down'}">${hm(Math.abs(c.delta))} ${ahead ? 'ahead' : 'behind'}</b>.</p>
      <p class="aside">${TODAY_NAME} is still open. ${state.mode === 'cut'
        ? `Last week’s ${TODAY_NAME} is cut at ${NOW_LABEL} so the two match.`
        : `Last week’s ${TODAY_NAME} is counted in full, so part of that gap is just the day being unfinished.`}
        <button data-mode="${state.mode === 'cut' ? 'days' : 'cut'}">${state.mode === 'cut' ? 'Compare whole days instead' : `Cut last week at ${NOW_LABEL}`}</button>
      </p>
      ${state.mode === 'cut' ? '<p class="foot">Estimate. Paused time is spread evenly within any sprint that crosses 16:15. Exact pause times are not available.</p>' : ''}
      <div class="day-strip">${dayStrip}</div>
      <div class="legend"><span><i style="background:var(--accent)"></i>This week</span><span><i style="background:#ddd5b4"></i>Last week</span></div>
      <details>
        <summary>Show the numbers</summary>
        <table>
          <thead><tr><th>Day</th><th class="n">This week</th><th class="n">Last week</th><th class="n">Change</th></tr></thead>
          <tbody>${cmpRows}</tbody>
        </table>
      </details>
    </div>
  </div>`;
}

function renderDAnalytics() {
  const g = buildConsistency();
  const s = buildSprints();
  return `
  <div class="proto-note"><b>D — Final mix.</b> ${VARIANTS.D.note}</div>

  <div class="block">
    <div class="placement">Analytics · <b>goal consistency, above the trend chart</b></div>
    ${goalGridHTML(g)}
  </div>

  <div class="block">
    <div class="placement">Analytics · <b>sprint patterns, below goal consistency</b></div>
    ${sprintCardHTML(s)}
  </div>`;
}

/* ============================================================
   Switcher
   ============================================================ */
const state = { variant: 'D', mode: 'cut', page: 'week' };
const ORDER = ['A', 'B', 'C', 'D'];

function activePage(v) {
  if (v !== 'D') return VARIANTS[v].page;
  return state.page === 'week' ? 'Week' : 'Analytics';
}

function setVariant(v, push = true) {
  state.variant = v;
  if (push) {
    try { history.replaceState(null, '', `?variant=${v}&page=${state.page}`); } catch (e) { /* file:// */ }
  }
  renderSidebar(v);
  renderTopbar(v);
  document.getElementById('canvas').innerHTML =
    v === 'A' ? renderA()
    : v === 'B' ? renderB()
    : v === 'C' ? renderC()
    : renderD();
  document.getElementById('label').innerHTML =
    `<b>${v}</b> <span>— ${VARIANTS[v].name}</span>`;
  document.querySelector('.main').scrollTop = 0;
}

function setMode(mode) {
  state.mode = mode;
  setVariant(state.variant, false);
}

function setPage(page) {
  state.page = page;
  try { history.replaceState(null, '', `?variant=D&page=${page}`); } catch (e) { /* file:// */ }
  setVariant('D', false);
}

document.getElementById('prev').onclick = () => {
  const i = ORDER.indexOf(state.variant);
  setVariant(ORDER[(i + ORDER.length - 1) % ORDER.length]);
};
document.getElementById('next').onclick = () => {
  const i = ORDER.indexOf(state.variant);
  setVariant(ORDER[(i + 1) % ORDER.length]);
};

document.addEventListener('keydown', e => {
  const el = document.activeElement;
  if (el && (['INPUT', 'TEXTAREA', 'SELECT'].includes(el.tagName) || el.isContentEditable)) return;
  if (e.key === 'ArrowLeft') document.getElementById('prev').click();
  if (e.key === 'ArrowRight') document.getElementById('next').click();
});

// mode and page toggles live inside the rendered markup
document.getElementById('canvas').addEventListener('click', e => {
  const btn = e.target.closest('[data-mode]');
  if (btn) setMode(btn.dataset.mode);
});

document.getElementById('topbar').addEventListener('click', e => {
  const btn = e.target.closest('[data-page]');
  if (btn) setPage(btn.dataset.page);
});

const params = new URLSearchParams(location.search);
const initial = params.get('variant');
const initialPage = params.get('page');
if (initialPage === 'analytics' || initialPage === 'week') state.page = initialPage;
setVariant(ORDER.includes(initial) ? initial : 'D', false);
</script>
</body>
</html>
