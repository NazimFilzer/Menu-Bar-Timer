<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Skeval Timer menu prototype</title>
<!--
THROWAWAY UI PROTOTYPE. Sample data. No storage, app calls, or clipboard writes.
Question: which menu layout makes timer actions and daily timesheet copy clear?
Three structures at the app's 330-point width, in the established Citrus theme.
Selected: Layout B, approved for native implementation on 2026-11-10.
A: quick controls. B: daily summary. C: timesheet first.
Standalone HTML follows this native app's existing Prototype/ convention.
Open this file, or run: open Prototype/menu-popover-prototype.html
?variant=A|B|C&state=active|idle|paused|reached|empty|sleep|recovery|error&theme=light|dark
Arrow keys switch layouts outside form controls. All actions change sample data only.
-->
<style>
*{box-sizing:border-box}
html,body{margin:0;background:transparent}
body{font-family:var(--font-sans,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif);color:var(--foreground,#252831);font-size:13px;line-height:1.45}
button,input,select{font:inherit}
button,select{cursor:pointer}
button{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:30px;padding:5px 10px;border:1px solid var(--border,#d6d8df);border-radius:6px;color:inherit;background:var(--card,#fff)}
button:disabled{opacity:.5;cursor:default}
button:hover:not(:disabled){filter:brightness(.97)}
button:active:not(:disabled){transform:translateY(1px)}
:focus-visible{outline:2px solid var(--ring,#5477c5);outline-offset:3px}
button svg{width:14px;height:14px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
input,select{border:1px solid var(--border,#d6d8df);border-radius:6px;background:var(--card,#fff);color:inherit;padding:5px 7px;min-width:0}
select{max-width:180px}
.prototype{width:100%;padding:0 0 82px}
.preview-controls{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.preview-controls label{display:flex;gap:6px;align-items:center;font-size:12px}
.preview-controls .reset{margin-left:auto}
.demo-note{font-size:12px;color:var(--muted-foreground,#677080);margin:0 0 16px}
.workbench{display:grid;grid-template-columns:330px minmax(0,1fr);gap:24px;align-items:start}
.preview-column{width:330px;max-width:100%;margin-inline:auto}
.menu-bar{display:flex;align-items:center;justify-content:flex-end;gap:14px;padding:7px 12px;margin-bottom:12px;border-radius:8px;color:var(--muted-foreground,#677080);background:var(--secondary,#edf0f4);font-size:11px}
.menu-bar time{font-variant-numeric:tabular-nums}
.menu-pill{background:var(--s-accent);color:var(--s-on-accent);font-weight:700;font-family:var(--font-mono,"SF Mono",Menlo,monospace);border-radius:5px;padding:2px 7px;display:inline-flex;align-items:center;gap:5px}
.menu-pill svg{width:10px;height:10px;stroke:currentColor;stroke-width:2;fill:none}
.menu-pill.is-paused{background:#d99a3d;color:#19160e}
.menu-pill.is-idle{background:#4a4a4a;color:#fff}
.menu-pill.is-held{background:#5856a8;color:#fff}
.surface{--s-ground:#fffae6;--s-card:#fff;--s-line:#e8e0ba;--s-text:#38301c;--s-muted:#716647;--s-accent:#e0b24c;--s-accent-text:#876b2e;--s-on-accent:#171207;--s-wash:#e0b24c20;--s-danger:#b14840;--s-danger-wash:#b1484010;--s-orange:#995900;--s-orange-wash:#ff950018;--s-success:#22774d;--s-hold:#4947ad;--s-hold-wash:#5856d614;--s-track:#e7e2cf}
.surface[data-theme=dark]{--s-ground:#1f1c14;--s-card:#29291f;--s-line:#5d5745;--s-text:#f4f0df;--s-muted:#c6bfa8;--s-accent:#e0b24c;--s-accent-text:#e9c477;--s-on-accent:#171207;--s-wash:#e0b24c18;--s-danger:#f0958b;--s-danger-wash:#d6594f1c;--s-orange:#efb868;--s-orange-wash:#ff950016;--s-success:#90d3a5;--s-hold:#b1adff;--s-hold-wash:#8f88ff16;--s-track:#514b39}
.popover{width:330px;max-width:100%;background:var(--s-ground);color:var(--s-text);border:1px solid var(--s-line);border-radius:12px;box-shadow:0 10px 26px #0000001f;overflow:hidden;font-size:13px}
.popover button,.popover input,.popover select,.app-dialog button,.app-dialog input{--border:var(--s-line);--card:var(--s-card);--ring:var(--s-accent-text);color:var(--s-text);caret-color:var(--s-accent-text)}
.popover ::selection,.app-dialog ::selection{background:var(--s-accent);color:var(--s-on-accent)}
.popover :focus-visible,.app-dialog :focus-visible{outline-color:var(--s-accent-text)}
.app-header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px;border-bottom:1px solid var(--s-line)}
.app-title{font-size:13px;font-weight:700;letter-spacing:.02em}
.app-header .dashboard{font-size:11px;min-height:27px;padding:3px 7px;background:transparent}
.section{padding:16px;border-bottom:1px solid var(--s-line)}
.section:last-child{border-bottom:0}
.flex{display:flex;align-items:center;gap:8px;min-width:0}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:8px}
.muted{color:var(--s-muted)}
.small{font-size:11px}
.mono{font-family:var(--font-mono,"SF Mono",Menlo,monospace);font-variant-numeric:tabular-nums}
.section-title{font-weight:600;font-size:12px;margin:0}
.status{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;color:var(--s-accent-text)}
.status::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--s-accent)}
.status.paused{color:var(--s-orange)}.status.paused::before{background:var(--s-orange)}
.status.idle{color:var(--s-muted)}.status.idle::before{background:var(--s-muted)}
.status.held{color:var(--s-hold)}.status.held::before{background:var(--s-hold)}
.clock{font-family:var(--font-mono,"SF Mono",Menlo,monospace);font-size:40px;font-weight:300;letter-spacing:-.025em;line-height:1.25;text-align:center;margin:13px 0 8px;font-variant-numeric:tabular-nums}
.clock.live{color:var(--s-accent-text);text-shadow:0 2px 10px #e0b24c25}
.clock.paused{color:var(--s-orange)}
.clock-caption{text-align:center;color:var(--s-muted);font-size:12px;margin-bottom:14px}
.clock-caption b{font-weight:600;color:var(--s-text)}
.action-row{display:flex;gap:8px;margin-top:12px}
.action-row button{flex:1;min-height:36px;font-weight:600;font-size:12px}
.popover .primary,.app-dialog .primary{background:linear-gradient(145deg,var(--s-accent),#dba838);border-color:transparent;color:var(--s-on-accent);font-weight:600}
.popover .primary{box-shadow:0 3px 9px #b78c2426}
.popover .pause{color:var(--s-orange);background:var(--s-orange-wash);border-color:var(--s-line)}
.popover .resume{background:#edac48;color:#201704;border-color:transparent}
.popover .stop{background:#b14840;border-color:#b14840;color:#fff}
.popover .wide{width:100%;min-height:34px;font-weight:600}
.popover .text-button{background:transparent;border-color:transparent;padding:3px 0;min-height:26px;color:var(--s-accent-text);font-size:11px}
.popover .icon-button{width:28px;height:28px;min-height:28px;padding:5px;background:transparent}
.menu-wrap{position:relative}
.more-menu{position:absolute;right:0;top:32px;z-index:5;min-width:180px;padding:4px;border:1px solid var(--s-line);background:var(--s-card);border-radius:8px;box-shadow:0 6px 15px #0002}
.more-menu button{display:flex;width:100%;justify-content:flex-start;border:0;white-space:nowrap;padding:6px 8px;font-size:12px}
.more-menu .danger{color:var(--s-danger)}
.value{font-family:var(--font-mono,"SF Mono",Menlo,monospace);font-size:24px;font-weight:600;font-variant-numeric:tabular-nums}
.today-figure{font-size:34px}
.goal-line{display:flex;align-items:baseline;justify-content:space-between;gap:6px;margin:8px 0}
.progress{height:5px;background:var(--s-track);border-radius:4px;overflow:hidden;margin:9px 0}
.progress span{display:block;background:var(--s-accent);height:100%;border-radius:4px}
.summary-pair{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:12px}
.summary-pair>div{display:flex;flex-direction:column;gap:3px}
.summary-pair b{font-family:var(--font-mono,"SF Mono",Menlo,monospace);font-size:17px;font-weight:600}
.forecast{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-top:12px}
.forecast b{font-family:var(--font-mono,"SF Mono",Menlo,monospace);font-size:14px;color:var(--s-accent-text)}
.forecast-note{font-size:11px;color:var(--s-muted);margin-top:3px}
.break-control{display:flex;align-items:center;justify-content:space-between;margin-top:10px;gap:8px;font-size:11px;color:var(--s-muted)}
.break-control button{min-height:24px;height:24px;width:24px;padding:2px;font-size:14px;background:var(--s-card)}
.break-control output{min-width:37px;text-align:center;font-variant-numeric:tabular-nums;color:var(--s-text)}
.history-header{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.history-header select{font-size:11px;max-width:125px;padding:3px 5px;background:var(--s-card)}
.sprint-row{display:flex;align-items:center;justify-content:space-between;gap:6px;min-height:46px;border-bottom:1px solid var(--s-line)}
.sprint-row:last-child{border-bottom:0}
.sprint-time{font-family:var(--font-mono,"SF Mono",Menlo,monospace);font-size:12px;font-variant-numeric:tabular-nums}
.row-meta{font-size:11px;color:var(--s-muted);margin-top:2px}
.history-label{margin-top:10px;font-size:11px;color:var(--s-muted)}
.empty{font-size:12px;color:var(--s-muted);padding:14px 0;line-height:1.5}
.history-actions{display:flex;gap:12px;justify-content:space-between;margin-top:8px}
.popover details summary{list-style:none;display:flex;align-items:center;justify-content:space-between;font-size:12px;font-weight:600;cursor:pointer;min-height:28px;gap:8px}
.popover details summary::-webkit-details-marker{display:none}
.popover details summary::after{content:"+";font-size:16px;font-weight:400;color:var(--s-accent-text)}
.popover details[open] summary::after{content:"−"}
.popover details[open]>.detail-body{margin-top:10px}
.tag-entry{display:flex;align-items:center;gap:8px;margin-top:10px}
.tag-entry input{width:100%;font-size:12px;background:var(--s-card)}
.footer{display:flex;align-items:center;justify-content:space-between;padding:8px 16px;color:var(--s-muted);font-size:11px}
.footer button{border:0;padding:3px 0;min-height:25px;color:var(--s-muted);background:transparent;font-size:11px}
.alert{margin:12px 16px 0;padding:12px;background:var(--s-hold-wash);border:1px solid var(--s-line);border-radius:8px;font-size:12px}
.alert strong{font-size:12px;display:block;margin-bottom:4px;color:var(--s-hold)}
.alert p{margin:4px 0 8px;color:var(--s-muted);font-size:11px}
.alert button{font-size:11px;min-height:29px;padding:4px 7px}
.alert.error{background:var(--s-danger-wash)}.alert.error strong{color:var(--s-danger)}
.compact-live{padding:12px 16px;border-bottom:1px solid var(--s-line)}
.compact-live .live-value{font-family:var(--font-mono,"SF Mono",Menlo,monospace);font-size:19px;font-weight:500;font-variant-numeric:tabular-nums}
.compact-live .action-row{margin-top:9px}
.ledger-heading{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:14px}
.ledger-heading h2{font-size:17px;font-weight:600;margin:0}
.ledger-figures{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.ledger-figures>div:last-child{text-align:right}
.ledger-figures .money{font-size:20px}
.timesheet-grid{display:grid;grid-template-columns:1fr 1fr;gap:0;margin:10px 0 12px;border-top:1px solid var(--s-line);border-bottom:1px solid var(--s-line)}
.timesheet-cell{padding:10px 0;display:flex;flex-direction:column;gap:4px}
.timesheet-cell:nth-child(2n){padding-left:16px}
.timesheet-cell:nth-child(-n+2){border-bottom:1px solid var(--s-line)}
.timesheet-cell span{font-size:11px;color:var(--s-muted)}
.timesheet-cell b{font-size:14px;font-family:var(--font-mono,"SF Mono",Menlo,monospace);font-weight:500}
.toast{padding:9px 12px;margin:0 16px 12px;border:1px solid var(--s-line);border-radius:6px;background:var(--s-card);font-size:11px;display:flex;gap:8px;align-items:center;justify-content:space-between}
.toast button{padding:2px 4px;min-height:23px;font-size:11px;color:var(--s-accent-text);border:0}
.notes{min-width:0;font-size:13px}
.notes h1{font-size:19px;letter-spacing:-.02em;margin:0 0 6px;font-weight:600}
.notes .intro{margin:0 0 16px;color:var(--muted-foreground,#677080);line-height:1.6}
.notes h2{font-size:13px;margin:20px 0 10px;font-weight:600}
.changes{padding:0;margin:0;list-style:none}
.changes li{padding:10px 0;border-top:1px solid var(--border,#d6d8df)}
.changes strong{display:block;font-size:12px;font-weight:600;margin-bottom:3px}
.changes span{display:block;font-size:12px;color:var(--muted-foreground,#677080);line-height:1.6}
.try-actions{display:flex;gap:6px;flex-wrap:wrap}
.try-actions button{font-size:11px;min-height:28px}
.state-readout{display:grid;grid-template-columns:auto 1fr;gap:5px 12px;font-size:11px;margin:0}
.state-readout dt{color:var(--muted-foreground,#677080)}
.state-readout dd{margin:0;text-align:right;overflow-wrap:anywhere}
.sample-output{margin-top:16px;border-top:1px solid var(--border,#d6d8df);padding-top:12px}
.sample-output code{display:block;background:var(--code-background,#edf0f4);border-radius:6px;padding:10px;font-family:var(--font-mono,"SF Mono",Menlo,monospace);font-size:11px;white-space:pre-wrap;overflow-wrap:anywhere}
.sample-output p{font-size:11px;color:var(--muted-foreground,#677080)}
.switcher{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);z-index:20;display:flex;align-items:center;gap:5px;padding:6px;border:1px solid #525965;border-radius:12px;background:#252a33;color:#fff;box-shadow:0 5px 18px #0003;width:max-content;max-width:calc(100% - 12px)}
.switcher button{background:#363d49;color:#fff;border:0;min-height:30px;min-width:32px;padding:4px 8px}
.switcher .variant-button{min-width:170px;background:transparent;flex-direction:column;gap:0;font-size:12px;line-height:1.3}
.switcher small{font-size:10px;color:#c5cedb}
.app-dialog{padding:18px;width:310px;max-width:calc(100% - 24px);border:1px solid var(--s-line);border-radius:12px;background:var(--s-ground);color:var(--s-text);box-shadow:0 12px 35px #0004}
.app-dialog::backdrop{background:#0006}
.app-dialog h2{font-size:16px;margin:0 0 10px;font-weight:600}
.app-dialog p{font-size:12px;line-height:1.6;margin:8px 0;color:var(--s-muted)}
.app-dialog label{display:flex;flex-direction:column;gap:5px;margin:12px 0;font-size:12px}
.app-dialog .dialog-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.app-dialog button{font-size:12px}
.app-dialog .danger{background:#b14840;border-color:#b14840;color:#fff}
.app-dialog .form-error{color:var(--s-danger)}
.app-dialog pre{font:11px var(--font-mono,"SF Mono",Menlo,monospace);white-space:pre-wrap;line-height:1.7}
@media(min-width:850px){.workbench{grid-template-columns:330px minmax(280px,380px);justify-content:center}}
@media(max-width:620px){.workbench{grid-template-columns:minmax(0,1fr);gap:24px}.notes{max-width:390px;margin-inline:auto;width:100%}.preview-controls{gap:8px}.preview-controls select{max-width:150px}.preview-controls .reset{margin-left:0}.notes h1{font-size:18px}.clock{font-size:39px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition:none!important;animation:none!important}}
</style>
</head>
<body>
<main class="prototype">
  <div class="preview-controls" aria-label="Prototype controls">
    <label>State <select id="scenario"><option value="active">Active sprint</option><option value="idle">Ready to start</option><option value="paused">Paused sprint</option><option value="reached">Daily goal reached</option><option value="empty">Empty day</option><option value="sleep">Sleep decision</option><option value="recovery">Unfinished sprint</option><option value="error">Save error</option></select></label>
    <label>Look <select id="theme"><option value="light">Citrus light</option><option value="dark">Citrus dark</option></select></label>
    <button id="advance">Add 1 min</button>
    <button class="reset" id="reset">Reset sample</button>
  </div>
  <p class="demo-note">Throwaway layout prototype. Sample data only. Time advances when you choose Add 1 min. Copy actions show sample output.</p>
  <div class="workbench">
    <div class="preview-column surface" id="surface" data-theme="light"><div id="menu-bar"></div><div class="popover" id="app"></div></div>
    <aside class="notes" id="notes" aria-label="Design changes"></aside>
  </div>
</main>
<nav class="switcher" aria-label="Compare layouts">
  <button id="previous" aria-label="Previous layout"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m14 6-6 6 6 6"/></svg></button>
  <button id="variant" class="variant-button" aria-label="Next layout"></button>
  <button id="next" aria-label="Next layout"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m10 6 6 6-6 6"/></svg></button>
</nav>
<dialog class="app-dialog surface" id="dialog" aria-labelledby="dialog-title"></dialog>
<script>
const variants={
 A:{name:'Quick controls',description:'Timer actions come first. Daily progress and timesheet copy stay close. Optional details open below.',tradeoff:'The best starting point for short timer checks. Detailed review stays in the dashboard.'},
 B:{name:'Daily summary',description:'A compact timer strip leaves more room for today’s hours and earnings. Recent sprints stay visible.',tradeoff:'Choose this if you open the menu to check the whole day as often as you control a sprint.'},
 C:{name:'Timesheet first',description:'A compact timer stays at the top. A separate timesheet area shows exactly what the daily copy action uses.',tradeoff:'Choose this if preparing the employer timesheet is the main reason you open the menu.'}
};
const query=new URLSearchParams(location.search);
const allowedStates=['active','idle','paused','reached','empty','sleep','recovery','error'];
const initial={variant:variants[query.get('variant')]?query.get('variant'):'B',scenario:allowedStates.includes(query.get('state'))?query.get('state'):'active',theme:query.get('theme')==='dark'?'dark':'light'};
let view={...initial,review:'today',menu:null,detail:false,toast:'',output:null,undo:null,copied:false,breaks:15};
let data;
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const icons={play:'<path d="m8 5 11 7-11 7Z"/>',pause:'<path d="M8 5v14M16 5v14"/>',stop:'<rect x="6" y="6" width="12" height="12" rx="1"/>',more:'<circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/>',window:'<rect x="3" y="4" width="18" height="16" rx="3"/><path d="M3 9h18M7 6.5h.01M10 6.5h.01"/>',copy:'<rect x="8" y="8" width="12" height="13" rx="2"/><path d="M16 8V3H3v13h5"/>',check:'<path d="m5 12 4 4L19 6"/>',tag:'<path d="M3 3h8l10 10-8 8L3 11Z"/><circle cx="7.5" cy="7.5" r="1"/>'};
const icon=name=>`<svg viewBox="0 0 24 24" aria-hidden="true">${icons[name]||icons.more}</svg>`;
const action=(name,label,classes='',attrs='')=>`<button data-action="${name}" class="${classes}" ${attrs}>${label}</button>`;
function seed(scenario){
 const today=[{id:'t1',start:540,end:670,pause:10,tag:'Development'},{id:'t2',start:690,end:825,pause:15,tag:'Client'}];
 const yesterday=[{id:'y1',start:540,end:735,pause:15,tag:'Development'},{id:'y2',start:780,end:960,pause:0,tag:'Client'}];
 const run={active:'active',idle:'idle',paused:'paused',reached:'idle',empty:'idle',sleep:'sleep',recovery:'recovery',error:'active'}[scenario];
 data={logs:{today:scenario==='empty'?[]:today,yesterday},run,elapsed:scenario==='paused'?20*60:30*60,pause:scenario==='paused'?10*60:0,pauseCurrent:scenario==='paused'?10*60:0,start:840,now:870,tag:'Client',saveError:scenario==='error'};
 if(scenario==='reached'){data.logs.today.push({id:'t3',start:840,end:1080,pause:0,tag:'Client'});data.now=1080;}
 if(scenario==='sleep') data.elapsed=15*60;
}
const net=s=>(s.end-s.start-s.pause)*60;
const completed=day=>data.logs[day].reduce((sum,s)=>sum+net(s),0);
const isOpen=()=>data.run!=='idle';
const held=()=>['sleep','recovery'].includes(data.run);
const total=()=>completed('today')+(['active','paused'].includes(data.run)?data.elapsed:0);
const duration=seconds=>{const m=Math.floor(seconds/60);return `${Math.floor(m/60)}h ${String(m%60).padStart(2,'0')}m`;};
const clock=seconds=>`${String(Math.floor(seconds/3600)).padStart(2,'0')}:${String(Math.floor(seconds%3600/60)).padStart(2,'0')}:${String(Math.floor(seconds%60)).padStart(2,'0')}`;
const time=minutes=>`${String(Math.floor(minutes/60)%24).padStart(2,'0')}:${String(Math.floor(minutes)%60).padStart(2,'0')}`;
const money=seconds=>'₹'+(seconds/3600*1500).toLocaleString('en-IN',{maximumFractionDigits:2});
const dayName=()=>view.review==='today'?'Today':'Yesterday';
const status=()=>({active:'Active',paused:'Paused',idle:'Idle',sleep:'Sleep held',recovery:'Needs review'}[data.run]);
function pill(){const paused=data.run==='paused';return `<div class="menu-bar"><span>Skeval Timer</span><span class="menu-pill ${held()?'is-held':paused?'is-paused':data.run==='idle'?'is-idle':''}" title="${held()?'Sprint held until your choice':paused?'Current pause':data.run==='idle'?'Today’s total':'Current sprint'}">${icon(held()||paused?'pause':isOpen()?'play':'stop')}${clock(paused?data.pauseCurrent:data.run==='idle'?total():data.elapsed)}</span><time>${time(data.now)}</time></div>`;}
function header(){return `<header class="app-header"><span class="app-title">Skeval Timer</span><div class="flex">${action('dashboard',icon('window')+'Dashboard','dashboard')}<div class="menu-wrap">${action('menu',icon('more'),'icon-button','aria-label="More actions" aria-expanded="'+(view.menu==='main')+'"')}${view.menu==='main'?`<div class="more-menu">${action('tag','Edit sprint tag','',!isOpen()?'disabled':'')}${action('discard','Discard sprint…','danger',!isOpen()?'disabled':'')}${action('about','About Skeval Timer')}${action('quit','Quit Skeval Timer')}</div>`:''}</div></div></header>`;}
function stateLabel(){const cls=held()?'held':data.run==='paused'?'paused':data.run==='idle'?'idle':'';return `<span class="status ${cls}">${status()}</span>`;}
function buttons(){if(data.run==='idle')return `<div class="action-row">${action('clock-in',icon('play')+'Clock in','primary')}</div>`;return `<div class="action-row">${action('pause',icon(data.run==='paused'?'play':'pause')+(data.run==='paused'?'Resume':'Pause'),data.run==='paused'?'resume':'pause',held()?'disabled':'')}${action('clock-out',icon('stop')+'Clock out','stop',held()?'disabled':'')}</div>`;}
function alerts(){let result='';
 if(data.run==='sleep') result=`<div class="alert"><strong>Your Mac was asleep</strong><p>14:15 to 14:30. The timer is held. Your choice includes the time until you decide.</p><div class="flex">${action('sleep-work','Count as work','primary')}${action('sleep-pause','Count as paused')}</div></div>`;
 if(data.run==='recovery') result=`<div class="alert"><strong>Unfinished sprint from 14:00</strong><p>Choose how to finish this sprint before starting another.</p><div class="flex">${action('recover-resume','Resume','primary')}${action('recover-end','Set end time')}</div></div>`;
 if(data.saveError) result+=`<div class="alert error"><strong>This change was not saved</strong><p>Keep the app open and try again. Do not quit until the save succeeds.</p>${action('retry','Try save again')}</div>`;
 return result;
}
function focusTimer(){const idle=data.run==='idle';const label=idle?'Today · Tue, 10 Nov':'Current sprint · Today';return `<section class="section"><div class="flex between"><h2 class="section-title">${label}</h2>${stateLabel()}</div><div class="clock ${!idle?'live':''} ${data.run==='paused'?'paused':''}">${idle?duration(total()):clock(data.elapsed)}</div><div class="clock-caption">${idle?(total()>=28800?'Daily goal reached':'Recorded today'):(data.run==='paused'?`Paused for <b>${clock(data.pauseCurrent)}</b>`:held()?'Time needs your review':`Started at ${time(data.start)}`)}</div>${buttons()}</section>`;}
function compactTimer(){return `<section class="compact-live"><div class="flex between"><div class="stack" style="gap:2px"><h2 class="section-title">${isOpen()?'Current sprint · Today':'Timer · Today'}</h2>${stateLabel()}</div><span class="live-value">${isOpen()?clock(data.elapsed):'Ready'}</span></div>${data.run==='paused'?`<div class="small muted" style="margin-top:5px">Paused for ${clock(data.pauseCurrent)}</div>`:''}${buttons()}</section>`;}
function forecast(){if(held())return `<div class="forecast-note" style="margin-top:12px">Resolve this sprint to show the finish-time forecast.</div>`;
 const left=Math.max(0,28800-total());if(!left)return `<div class="forecast"><span>Daily goal reached</span><b style="color:var(--s-success)">8h recorded</b></div>`;
 const finish=time(data.now+left/60+view.breaks);return `<div class="forecast"><span>Finish around</span><b>${finish}</b></div><div class="forecast-note">${data.run==='paused'?'If you resume now':data.run==='idle'?'If you clock in now':'If you keep working'}. Includes ${view.breaks} min of upcoming breaks.</div><div class="break-control"><span>Upcoming breaks</span><div class="flex">${action('break-less','−','','aria-label="Reduce upcoming breaks" '+(view.breaks===0?'disabled':''))}<output>${view.breaks} min</output>${action('break-more','+','','aria-label="Add upcoming breaks" '+(view.breaks===240?'disabled':''))}</div></div>`;
}
function goalBar(){return `<div class="progress" role="progressbar" aria-label="Daily goal progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${Math.min(100,Math.round(total()/288))}"><span style="width:${Math.min(100,total()/288)}%"></span></div>`;}
function dailySummary(){return `<section class="section"><div class="flex between"><h2 class="section-title">Today’s daily goal</h2><span class="small muted">${duration(Math.max(0,28800-total()))} left</span></div><div class="goal-line"><b class="mono">${duration(total())} <span class="muted" style="font-weight:400">/ 8h</span></b><span class="mono small">${money(total())}</span></div>${goalBar()}${forecast()}<div style="margin-top:14px">${copyDayButton(false,'today')}</div><div class="history-label">Completed sprints only. Live work stays out of this row.</div></section>`;}
function daySelect(){return `<select id="review-day" aria-label="Timesheet date"><option value="today" ${view.review==='today'?'selected':''}>Today, 10 Nov</option><option value="yesterday" ${view.review==='yesterday'?'selected':''}>Yesterday, 9 Nov</option></select>`;}
function copyDayButton(primary=false,day=view.review){return action('copy-day:'+day,icon(view.copied===day?'check':'copy')+(view.copied===day?'Copy simulated':`Copy ${day==='today'?'today’s':'yesterday’s'} timesheet`),`wide ${primary?'primary':''}`,!data.logs[day].length?'disabled':'');}
function rows(){return data.logs[view.review].slice().reverse().slice(0,2).map(s=>`<div class="sprint-row"><div><div class="sprint-time">${time(s.start)} – ${time(s.end)}</div><div class="row-meta">${duration(net(s))} net${s.pause?' · '+s.pause+' min paused':''}</div></div><div class="menu-wrap">${action('row-menu:'+s.id,icon('more'),'icon-button','aria-label="Actions for sprint starting '+time(s.start)+'" aria-expanded="'+(view.menu===s.id)+'"')}${view.menu===s.id?`<div class="more-menu">${action('details:'+s.id,'Sprint details')}${action('copy-sprint:'+s.id,'Copy sprint times')}${action('delete:'+s.id,'Delete sprint…','danger')}</div>`:''}</div></div>`).join('')||'<div class="empty">No completed sprints for this day. Clock in to start, or add a sprint you already finished.</div>';}
function sprintHistory(expanded=false){return `<section class="section">${expanded?`<div class="history-header"><h2 class="section-title">Recent sprints</h2>${daySelect()}</div>${rows()}${view.review==='yesterday'?`<div style="margin-top:10px">${copyDayButton()}</div>`:''}`:`<details ${view.detail?'open':''} id="sprint-details"><summary>Recent sprints <span class="small muted">${data.logs[view.review].length} completed</span></summary><div class="detail-body"><div class="history-header"><h2 class="section-title">Review date</h2>${daySelect()}</div>${rows()}${view.review==='yesterday'?`<div style="margin-top:10px">${copyDayButton()}</div>`:''}</div></details>`}<div class="history-actions">${action('add','Add sprint','text-button')}${action('dashboard','All history','text-button')}</div></section>`;}
function ledger(){return `<section class="section"><div class="ledger-heading"><h2>Today</h2><span class="small muted">Tue, 10 Nov</span></div><div class="ledger-figures"><div><div class="value">${duration(total())}</div><div class="small muted">Work time · 8h goal</div></div><div><div class="value money">${money(total())}</div><div class="small muted">Earnings · ₹1,500/h</div></div></div>${goalBar()}<div class="small muted">${duration(Math.max(0,28800-total()))} left to reach the daily goal</div>${forecast()}<div style="margin-top:14px">${copyDayButton(false,'today')}</div></section>`;}
function timesheet(){const list=data.logs[view.review];const worked=completed(view.review);const login=list.length?Math.min(...list.map(s=>s.start)):null;const logout=list.length?Math.max(...list.map(s=>s.end)):null;const breaks=list.length?Math.round(logout-login-worked/60):0;return `<section class="section"><div class="history-header"><h2 class="section-title">Daily timesheet</h2>${daySelect()}</div><div class="goal-line"><b class="value">${duration(worked)}</b><span class="mono">${money(worked)}</span></div><div class="small muted">${dayName()} · completed sprints only</div><div class="timesheet-grid"><div class="timesheet-cell"><span>Login</span><b>${login===null?'—':time(login)}</b></div><div class="timesheet-cell"><span>Logout</span><b>${logout===null?'—':time(logout)}</b></div><div class="timesheet-cell"><span>Lunch</span><b>Blank cell</b></div><div class="timesheet-cell"><span>Break</span><b>${breaks} min</b></div></div>${copyDayButton(true)}<div class="history-label">Break includes pauses and gaps between sprints.</div><div class="history-actions">${action('add','Add sprint','text-button')}${action('dashboard','Sprint details','text-button')}</div></section>`;}
function smallGoal(){return `<section class="section"><div class="flex between"><h2 class="section-title">Today’s daily goal</h2><b class="mono small">${duration(total())} / 8h</b></div>${goalBar()}${forecast()}</section>`;}
function footer(){return `<footer class="footer"><span>${data.saveError?'Save needs attention':'Local work history'}</span>${action('quit','Quit…')}</footer>`;}
function toast(){return view.toast?`<div class="toast" role="status"><span>${esc(view.toast)}</span>${view.undo?action('undo','Undo'):action('dismiss-toast','Dismiss')}</div>`:'';}
function VariantA(){return header()+alerts()+focusTimer()+dailySummary()+sprintHistory()+toast()+footer();}
function VariantB(){return header()+alerts()+compactTimer()+ledger()+sprintHistory(true)+toast()+footer();}
function VariantC(){return header()+alerts()+compactTimer()+timesheet()+smallGoal()+toast()+footer();}
function notes(){const v=variants[view.variant];return `<h1>${view.variant}. ${v.name}</h1><p class="intro">${v.description}</p><ul class="changes"><li><strong>Controls stay beside the timer</strong><span>${view.variant==='A'?'The timer is large during work. Today’s total replaces idle zeroes.':'A small timer strip stays above the daily information.'} Pause and Clock Out sit directly below it.</span></li><li><strong>Deletion needs a clear choice</strong><span>Discard moves into More actions. Sprint Delete moves into its row menu. Both ask before removing a sample sprint.</span></li><li><strong>Live work always says Today</strong><span>Change the review date below. The current sprint keeps its own Today label.</span></li><li><strong>Copy names its output</strong><span>Copy timesheet uses Login, Logout, blank Lunch, and Break. Copy sprint times uses the effective end time. Each has its own output preview.</span></li><li><strong>Details use less space</strong><span>No version badge or always-visible tag field. Short headings, larger row text, and visible keyboard focus reduce clutter.</span></li></ul><h2>Try the changes</h2><div class="try-actions">${action('try-discard','Discard flow')}${action('try-yesterday','Review yesterday')}${action('try-copy','Timesheet output')}</div><p class="intro" style="font-size:12px;margin-top:12px">${v.tradeoff}</p><h2>Sample state</h2><dl class="state-readout"><dt>Layout</dt><dd>${view.variant} · ${v.name}</dd><dt>Timer</dt><dd>${status()} · Today</dd><dt>Review date</dt><dd>${dayName()}</dd><dt>Work today</dt><dd>${duration(total())}</dd><dt>Completed today</dt><dd>${duration(completed('today'))}</dd><dt>Upcoming breaks</dt><dd>${view.breaks} min</dd></dl>${view.output?`<div class="sample-output" role="status"><strong>${esc(view.output.title)}</strong><code>${esc(view.output.text)}</code><p>${esc(view.output.note)} No clipboard change occurs in this prototype.</p></div>`:''}`;}
function syncURL(){const next=new URL(location.href);next.searchParams.set('variant',view.variant);next.searchParams.set('state',view.scenario);next.searchParams.set('theme',view.theme);try{history.replaceState(null,'',next);}catch{/* Embedded previews can restrict URL changes. */}}
function render(){const focus=document.activeElement;const actionName=focus?.dataset?.action;$('surface').dataset.theme=view.theme;$('dialog').dataset.theme=view.theme;$('menu-bar').innerHTML=pill();$('app').innerHTML=({A:VariantA,B:VariantB,C:VariantC}[view.variant])();$('notes').innerHTML=notes();$('variant').innerHTML=`<span>${view.variant} · ${variants[view.variant].name}</span><small>Compare 3 layouts · ← →</small>`;$('scenario').value=view.scenario;$('theme').value=view.theme;if(actionName){[...$('app').querySelectorAll('[data-action]')].find(e=>e.dataset.action===actionName)?.focus({preventScroll:true});}syncURL();}
function switchVariant(step){const keys=Object.keys(variants);view.variant=keys[(keys.indexOf(view.variant)+step+keys.length)%keys.length];view.menu=null;render();}
function showDialog(title,body,buttons){$('dialog').innerHTML=`<h2 id="dialog-title">${title}</h2>${body}<div class="dialog-actions">${buttons}</div>`;$('dialog').showModal();}
const cancel=()=>action('cancel-dialog','Cancel');
function findSprint(id){return data.logs[view.review].find(s=>s.id===id);}
function confirmDiscard(){if(!isOpen()){view.toast='Clock in first to try Discard.';render();return;}view.menu=null;render();showDialog('Discard this sprint?',`<p>This removes the open sprint from Today. It contains ${duration(data.elapsed)} of sample work. It will not count toward earnings.</p>`,action('cancel-dialog','Keep sprint','primary')+action('confirm-discard','Discard sprint','danger'));}
function previewCopy(day){const list=data.logs[day];if(!list.length){view.toast='This day has no completed sprints to copy.';return;}const start=Math.min(...list.map(s=>s.start));const end=Math.max(...list.map(s=>s.end));const brk=end-start-completed(day)/60;view.copied=day;view.output={title:`${day==='today'?'Today':'Yesterday'}’s timesheet row`,text:`${time(start)}:00 ⇥ ${time(end)}:00 ⇥ [blank] ⇥ ${Math.round(brk)}`,note:'Four tab-separated cells. No headers. Live sprint excluded.'};view.toast='Copy simulated. Sample output is beside the menu.';}
function openAdd(){showDialog(`Add sprint · ${dayName()}`,`<p>Enter a completed sprint for ${dayName().toLowerCase()}. This adds sample data only.</p><div class="flex"><label style="flex:1">Start<input id="manual-start" type="time" value="16:00" required></label><label style="flex:1">End<input id="manual-end" type="time" value="17:00" required></label></div><label>Paused minutes<input id="manual-break" type="number" min="0" value="0"></label><label>Tag, optional<input id="manual-tag" type="text" maxlength="40" placeholder="Client or development"></label><p id="manual-error" class="form-error" role="alert"></p>`,cancel()+action('save-manual','Add sample sprint','primary'));}
function closeDialog(){if($('dialog').open)$('dialog').close();}
function applyAction(raw){const [name,id]=raw.split(':');
 const commands={
  menu:()=>{view.menu=view.menu==='main'?null:'main';},
  'row-menu':()=>{view.menu=view.menu===id?null:id;},
  'clock-in':()=>{data.run='active';data.elapsed=0;data.pause=0;data.pauseCurrent=0;data.start=data.now;view.toast='Sample sprint started.';view.scenario='active';},
  pause:()=>{data.run=data.run==='paused'?'active':'paused';data.pauseCurrent=0;view.scenario=data.run;view.toast=data.run==='paused'?'Work time is held.':'Sample sprint resumed.';},
  'clock-out':()=>{data.logs.today.push({id:'sample'+Date.now(),start:data.start,end:data.now,pause:data.pause/60,tag:data.tag});data.run='idle';view.scenario='idle';view.toast='Sample sprint saved. Sprint copy is simulated.';view.output={title:'Individual sprint copy',text:`${time(data.start)}:00 ⇥ ${time(data.start+data.elapsed/60)}:00`,note:'Start and effective end time. Paused time is removed. This differs from the daily timesheet row.'};},
  discard:confirmDiscard,
  'try-discard':confirmDiscard,
  'confirm-discard':()=>{data.run='idle';view.scenario='idle';view.toast='Sample sprint discarded.';closeDialog();},
  'cancel-dialog':closeDialog,
  'break-less':()=>{view.breaks=Math.max(0,view.breaks-5);},
  'break-more':()=>{view.breaks=Math.min(240,view.breaks+5);},
  'copy-day':()=>previewCopy(id),
  'try-copy':()=>previewCopy(view.review),
  'try-yesterday':()=>{view.review=view.review==='today'?'yesterday':'today';view.detail=true;view.copied=false;view.toast='Only the review date changed. The timer still controls Today.';},
  'copy-sprint':()=>{const s=findSprint(id);view.output={title:'Individual sprint copy',text:`${time(s.start)}:00 ⇥ ${time(s.end-s.pause)}:00`,note:`Actual end is ${time(s.end)}. The copied end removes ${s.pause} paused minutes.`};view.menu=null;view.toast='Copy simulated. See the individual sprint output.';},
  details:()=>{const s=findSprint(id);view.menu=null;showDialog('Sprint details',`<p>${dayName()} · ${esc(s.tag||'No tag')}</p><pre>Start              ${time(s.start)}\nActual end         ${time(s.end)}\nPaused             ${s.pause} min\nNet work           ${duration(net(s))}\nEffective end      ${time(s.end-s.pause)}</pre><p>Individual sprint copy uses the effective end. The daily timesheet uses the actual Logout.</p>`,action('cancel-dialog','Done','primary'));},
  delete:()=>{const s=findSprint(id);view.menu=null;showDialog('Delete this sprint?',`<p>This removes the ${time(s.start)} to ${time(s.end)} sprint from ${dayName().toLowerCase()}. It contains ${duration(net(s))} of sample work.</p>`,action('cancel-dialog','Keep sprint','primary')+action('confirm-delete:'+id,'Delete sprint','danger'));},
  'confirm-delete':()=>{const index=data.logs[view.review].findIndex(s=>s.id===id);view.undo={day:view.review,index,sprint:data.logs[view.review][index]};data.logs[view.review].splice(index,1);view.toast='Sample sprint deleted.';view.copied=false;closeDialog();},
  undo:()=>{data.logs[view.undo.day].splice(view.undo.index,0,view.undo.sprint);view.undo=null;view.toast='Sample sprint restored.';},
  'dismiss-toast':()=>{view.toast='';},
  tag:()=>{view.menu=null;showDialog('Sprint tag',`<label>Tag, optional<input id="tag-value" value="${esc(data.tag)}" maxlength="40"></label>`,cancel()+action('save-tag','Set tag','primary'));},
  'save-tag':()=>{data.tag=$('tag-value').value.trim();view.toast=data.tag?'Tag set to '+data.tag+'.':'Tag removed.';closeDialog();},
  add:openAdd,
  'save-manual':()=>{const mins=value=>{const [h,m]=value.split(':').map(Number);return h*60+m;};const start=mins($('manual-start').value),end=mins($('manual-end').value),pause=Number($('manual-break').value);if(!Number.isFinite(start)||!Number.isFinite(end)||end<=start||pause<0||pause>=end-start){$('manual-error').textContent='Set an end after the start. Paused minutes must be less than the sprint length.';return;}data.logs[view.review].push({id:'manual'+Date.now(),start,end,pause,tag:$('manual-tag').value.trim()});view.toast='Sample sprint added to '+dayName().toLowerCase()+'.';view.copied=false;view.detail=true;closeDialog();},
  dashboard:()=>{view.menu=null;showDialog('Dashboard preview',`<p>In the app, this opens the dashboard. Full history, editing, tags, and weekly pace stay there.</p><pre>Today       ${duration(total())}\nEarnings    ${money(total())}\nGoal        8h\nYesterday   ${duration(completed('yesterday'))}</pre><p>The menu remains focused on quick actions. This prototype does not change the dashboard design.</p>`,action('cancel-dialog','Back to menu','primary'));},
  about:()=>{view.menu=null;showDialog('Skeval Timer',`<p>Version 2.2. In the proposed design, the version number moves here.</p><p>This is a browser layout model of a native Mac popover.</p>`,action('cancel-dialog','Done','primary'));},
  quit:()=>{view.menu=null;showDialog('Quit Skeval Timer?',`<p>${isOpen()?'The open sprint will need review when you return.':'The app closes after saving your work.'}</p><p>This prototype stays open. No real app action occurs.</p>`,action('cancel-dialog','Keep open','primary')+action('sample-quit','Simulate quit'));},
  'sample-quit':()=>{view.toast='Quit simulated. The prototype stays open.';closeDialog();},
  retry:()=>{data.saveError=false;view.scenario='active';view.toast='Sample save succeeded.';},
  'sleep-work':()=>{data.run='active';data.elapsed=30*60;view.scenario='active';view.toast='Sleep interval counted as work in this sample.';},
  'sleep-pause':()=>{data.run='active';data.elapsed=15*60;data.pause=15*60;view.scenario='active';view.toast='Sleep interval counted as paused in this sample.';},
  'recover-resume':()=>{data.run='active';view.scenario='active';view.toast='Sample sprint resumed from its original start.';},
  'recover-end':()=>showDialog('Set sprint end time',`<p>This unfinished sprint started today at 14:00.</p><label>End time<input id="recovery-end" type="time" value="14:30"></label><p id="recovery-error" class="form-error" role="alert"></p>`,cancel()+action('save-recovery','Save sample sprint','primary')),
  'save-recovery':()=>{const parts=$('recovery-end').value.split(':').map(Number);const end=parts[0]*60+parts[1];if(!Number.isFinite(end)||end<=data.start){$('recovery-error').textContent='Set an end time after 14:00.';return;}data.logs.today.push({id:'recovered',start:data.start,end,pause:0,tag:data.tag});data.run='idle';view.scenario='idle';view.toast='Recovered sample sprint saved.';closeDialog();}
 };
 commands[name]?.();render();
}
document.addEventListener('click',event=>{const button=event.target.closest('[data-action]');if(button&&!button.disabled)applyAction(button.dataset.action);});
document.addEventListener('change',event=>{if(event.target.id==='review-day'){view.review=event.target.value;view.copied=false;view.menu=null;view.output=null;render();}});
document.addEventListener('toggle',event=>{if(event.target.id==='sprint-details')view.detail=event.target.open;},true);
$('scenario').addEventListener('change',event=>{view.scenario=event.target.value;view.review='today';view.menu=null;view.toast='';view.undo=null;view.output=null;view.copied=false;closeDialog();seed(view.scenario);render();});
$('theme').addEventListener('change',event=>{view.theme=event.target.value;render();});
$('advance').addEventListener('click',()=>{if(held()){view.toast='Resolve the held sprint before advancing this sample.';}else{data.now+=1;if(data.run==='active')data.elapsed+=60;if(data.run==='paused'){data.pause+=60;data.pauseCurrent+=60;}}render();});
$('reset').addEventListener('click',()=>{view={...initial,review:'today',menu:null,detail:false,toast:'',output:null,undo:null,copied:false,breaks:15};closeDialog();seed(view.scenario);render();});
$('previous').addEventListener('click',()=>switchVariant(-1));$('next').addEventListener('click',()=>switchVariant(1));$('variant').addEventListener('click',()=>switchVariant(1));
document.addEventListener('keydown',event=>{if($('dialog').open||event.target.closest('input,textarea,select,[contenteditable="true"]'))return;if(event.key==='ArrowLeft'){event.preventDefault();switchVariant(-1);}if(event.key==='ArrowRight'){event.preventDefault();switchVariant(1);}if(event.key==='Escape'&&view.menu){view.menu=null;render();}});
seed(view.scenario);render();
</script>
</body>
</html>
